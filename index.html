<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>historymap — 世界史タイムライン地図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root{ --bg:#1b1d23; --panel:#23262e; --line:#363a44; --text:#e6e8ee; --muted:#9aa0ac; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
             background:var(--bg); color:var(--text); }
  #app{ display:grid; grid-template-columns:1fr 340px; grid-template-rows:auto 1fr; height:100vh; }
  header{ grid-column:1/3; background:var(--panel); border-bottom:1px solid var(--line);
          padding:10px 16px; display:flex; flex-direction:column; gap:8px; }
  .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  h1{ font-size:15px; margin:0; font-weight:700; letter-spacing:.02em; }
  h1 span{ color:var(--muted); font-weight:400; font-size:12px; margin-left:8px; }
  #yearBig{ font-size:26px; font-weight:800; min-width:140px; font-variant-numeric:tabular-nums; }
  #eraBadge{ font-size:12px; padding:2px 10px; border-radius:999px; background:#3a3f4b; color:#fff; }
  input[type=range]{ width:100%; accent-color:#5b9cff; }
  #slider{ flex:1; }
  button{ background:#323844; color:var(--text); border:1px solid var(--line); border-radius:6px;
          padding:5px 12px; cursor:pointer; font-size:13px; }
  button:hover{ background:#3c4350; }
  button.on{ background:#5b9cff; border-color:#5b9cff; color:#fff; }
  .cats{ display:flex; gap:6px; flex-wrap:wrap; }
  .cat{ font-size:12px; padding:3px 9px; border-radius:999px; cursor:pointer; user-select:none;
        border:1px solid transparent; opacity:.35; display:flex; align-items:center; gap:5px; }
  .cat.on{ opacity:1; }
  .cat .dot{ width:9px; height:9px; border-radius:50%; }
  #map{ grid-column:1; grid-row:2; }
  aside{ grid-column:2; grid-row:2; background:var(--panel); border-left:1px solid var(--line);
         overflow-y:auto; padding:12px 14px; }
  aside h2{ font-size:13px; color:var(--muted); margin:0 0 10px; font-weight:600; }
  .ev{ border-left:3px solid #555; padding:7px 10px; margin-bottom:8px; background:#1f222a;
       border-radius:0 6px 6px 0; transition:background .15s; }
  .ev.hl{ background:#33405c; box-shadow:0 0 0 1px #5b9cff inset; }
  .ev .y{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ev .t{ font-size:14px; font-weight:600; margin:2px 0; }
  .ev .t a{ color:var(--text); text-decoration:none; }
  .ev .t a:hover{ color:#8fbaff; text-decoration:underline; }
  .ev .t .ext{ font-size:10px; color:var(--muted); margin-left:4px; vertical-align:1px; }
  .ev .s{ font-size:12px; color:var(--muted); line-height:1.4; }
  .ev .meta{ font-size:11px; color:var(--muted); margin-top:3px; }
  .stars{ color:#ffcf56; letter-spacing:-1px; }
  .small{ font-size:12px; color:var(--muted); }
  .nav{ margin-left:auto; font-size:13px; color:#8fbaff; text-decoration:none; border:1px solid var(--line);
        padding:4px 10px; border-radius:6px; }
  .nav:hover{ background:#3c4350; }
  #err{ display:none; grid-column:1/3; padding:30px; line-height:1.7; }
  #err code{ background:#000; padding:2px 8px; border-radius:4px; color:#7fd; }
  .leaflet-popup-content{ font-size:13px; line-height:1.5; }
  .pop-t{ font-weight:700; }
  .ctrl-min{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .lyr{ font-size:12px; padding:3px 10px; border-radius:6px; cursor:pointer; user-select:none;
        border:1px solid var(--line); background:#2a2e38; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .lyr.on{ background:#3a4150; color:#fff; border-color:#5b9cff; }
  .lyr input{ accent-color:#5b9cff; }
  .sec{ font-size:12px; color:#8fbaff; font-weight:700; margin:12px 0 6px; border-bottom:1px solid var(--line); padding-bottom:3px; }
  .sec:first-child{ margin-top:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <h1>historymap <span>世界史タイムライン地図 — プロトタイプ</span></h1>
      <span id="eraBadge">—</span>
      <span id="count" class="small"></span>
      <a href="table.html" class="nav">▤ 表で見る</a>
    </div>
    <div class="row">
      <div id="yearBig">—</div>
      <input type="range" id="slider" min="-6500" max="2020" value="-550" step="1">
      <button id="play">▶ 再生</button>
    </div>
    <div class="row">
      <span class="small">レイヤー</span>
      <div class="cats" id="layers"></div>
      <label class="ctrl-min">表示幅 ±<span id="winVal">10</span>年
        <input type="range" id="window" min="0" max="500" value="10" step="10" style="width:140px"></label>
    </div>
    <div class="row">
      <span class="small">分類</span>
      <div class="cats" id="cats"></div>
    </div>
  </header>
  <div id="map"></div>
  <aside>
    <h2 id="panelTitle">この年の出来事</h2>
    <div id="panel"></div>
  </aside>
  <div id="err"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// ---- minimal CSV parser (no embedded commas in our data, but quote-safe) ----
function parseCSV(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.length);
  const head = splitLine(lines[0]);
  return lines.slice(1).map(line=>{
    const cells = splitLine(line);
    const o = {};
    head.forEach((h,i)=> o[h] = (cells[i] ?? '').trim());
    return o;
  });
}
function splitLine(line){
  const out=[]; let cur=''; let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ q=!q; continue; }
    if(c===','&&!q){ out.push(cur); cur=''; continue; }
    cur+=c;
  }
  out.push(cur); return out;
}

const ERAS = [
  {name:'先史', max:-1000, color:'#6b7280'},
  {name:'古代', max:476,   color:'#8e7cc3'},
  {name:'中世', max:1500,  color:'#3d85c6'},
  {name:'近世', max:1789,  color:'#45818e'},
  {name:'近代', max:1945,  color:'#cc7a00'},
  {name:'現代', max:9999,  color:'#cc0000'},
];
function eraOf(y){ for(const e of ERAS) if(y<e.max) return e; return ERAS[ERAS.length-1]; }
function fmtYear(y){ return y<0 ? 'BC'+(-y) : (y===0?'0':''+y); }
// 年代ごとに刻み幅を変える：先史1000年・古代10年・以降1年
function snapStep(y){ return y<-1000 ? 1000 : y<476 ? 10 : 1; }
// スライダーの停止点を生成（刻みが粗い時代ほど停止点が少なく＝幅も狭くなる）
function buildStops(){
  const s=[];
  for(let y=-6500; y<-1000; y+=1000) s.push(y);  // 先史
  for(let y=-1000; y<476;  y+=10)   s.push(y);    // 古代
  for(let y=476;  y<=2020; y+=1)    s.push(y);    // 中世以降
  return s;
}
function stars(n){ n=+n||0; return '★'.repeat(n)+'☆'.repeat(5-n); }
// Wikipedia(ja)記事への直リンク（wiki列は実在記事名で検証済み）
function wikiUrl(e){ return 'https://ja.wikipedia.org/wiki/'+encodeURIComponent(e.wiki||e.title); }

let EVENTS=[], REGIONS={}, CATS={}, enabled=new Set(), markers=[], map, STOPS=[], markerByKey={};
const CB='?v='+Date.now();     // キャッシュバスター（リロード毎に最新データを取得）
let LAYERS=[];                 // config/layers.json の layers
const layerCache={};           // key -> パース済み行(種別タグ付き)
const layerOn=new Set();       // 表示ONのレイヤーkey
// localStorageで設定を永続化
const LS={ get(k,d){ try{const v=localStorage.getItem('hm.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
           set(k,v){ try{localStorage.setItem('hm.'+k,JSON.stringify(v));}catch(e){} } };

function mapRow(x, type){
  return { _type:type, id:+x.id, year:+x.year_start, year_end:(x.year_end===''||x.year_end==null)?null:+x.year_end,
    label:x.year_label, era:x.era, area:x.area_code, region:x.region,
    cat:x.category, title:x.title, imp:+x.importance||3, summary:x.summary, wiki:x.wiki,
    lat:(x.lat!==''&&x.lat!=null)?+x.lat:null, lon:(x.lon!==''&&x.lon!=null)?+x.lon:null };
}

async function boot(){
  let manifest, catText, regText;
  try{
    manifest = await fetch('config/layers.json'+CB).then(r=>{ if(!r.ok) throw 0; return r.json(); });
    [catText,regText] = await Promise.all([
      fetch(manifest.masters.categories+CB).then(r=>r.text()),
      fetch(manifest.masters.regions+CB).then(r=>r.text())
    ]);
  }catch(e){ return showErr(); }
  if(catText.startsWith('<')) return showErr();

  parseCSV(catText).forEach(x=> CATS[x.code]={name:x.name_ja,color:x.color});
  parseCSV(regText).forEach(x=> REGIONS[x.area_code]={name:x.name_ja,
      lat:x.lat?+x.lat:null, lon:x.lon?+x.lon:null});
  LAYERS = manifest.layers;

  STOPS=buildStops(); initSlider(); initMap(); initCats(); buildLayerUI(); bindControls();
  const savedLayers=LS.get('layers',null);
  const onKeys = savedLayers ?? LAYERS.filter(l=>l.default).map(l=>l.key);
  for(const L of LAYERS.filter(l=>onKeys.includes(l.key))) await loadLayer(L);
  rebuild();
}
// レイヤーを遅延ロード（ONにされて初めてfetch、以後キャッシュ）
async function loadLayer(L){
  if(!layerCache[L.key]){
    try{ const t=await fetch(L.file+CB).then(r=>{ if(!r.ok) throw 0; return r.text(); });
      layerCache[L.key]=parseCSV(t).map(x=>mapRow(x,L.key));
    }catch(e){ layerCache[L.key]=[]; }
  }
  layerOn.add(L.key);
}
function unloadLayer(key){ layerOn.delete(key); }
function rebuild(){
  EVENTS = [].concat(...LAYERS.filter(l=>layerOn.has(l.key)).map(l=>layerCache[l.key]||[]));
  render();
}
function buildLayerUI(){
  const box=document.getElementById('layers');
  LAYERS.forEach(L=>{
    const saved=LS.get('layers',null);
    const on = saved? saved.includes(L.key) : L.default;
    const el=document.createElement('label'); el.className='lyr'+(on?' on':'');
    el.innerHTML=`<input type="checkbox" ${on?'checked':''}> ${L.label}`;
    el.querySelector('input').onchange=async e=>{
      if(e.target.checked){ await loadLayer(L); el.classList.add('on'); }
      else { unloadLayer(L.key); el.classList.remove('on'); }
      LS.set('layers',[...layerOn]); rebuild();
    };
    box.appendChild(el);
  });
}
function showErr(){
  document.getElementById('app').style.gridTemplateRows='auto 1fr';
  document.getElementById('map').style.display='none';
  document.querySelector('aside').style.display='none';
  const e=document.getElementById('err'); e.style.display='block';
  e.innerHTML = '<h2>データを読み込めませんでした</h2>'+
   '<p>ブラウザは <code>file://</code> から直接ファイルを読めません。'+
   'このフォルダで簡易サーバを立ててからアクセスしてください：</p>'+
   '<p><code>python3 -m http.server 8000</code></p>'+
   '<p>→ ブラウザで <code>http://localhost:8000/</code> を開く</p>';
}

function initSlider(){
  const sl=document.getElementById('slider');
  sl.min=0; sl.max=STOPS.length-1; sl.step=1;
  const saved=LS.get('year',null);
  if(saved!=null && saved>=0 && saved<=+sl.max){ sl.value=saved; }
  else { const def=STOPS.indexOf(-550); sl.value = def>=0 ? def : Math.floor(STOPS.length/2); }
  const w=document.getElementById('window'); const sw=LS.get('window',null);
  if(sw!=null){ w.value=sw; document.getElementById('winVal').textContent=sw; }
}
function initMap(){
  map = L.map('map',{worldCopyJump:true, minZoom:2}).setView([30,40],2);
  // 既定のLeafletリンクを外し、© goodsun（リポジトリ）に差し替え
  map.attributionControl.setPrefix('© <a href="https://github.com/goodsun/historymap" target="_blank" rel="noopener">goodsun</a>');
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:8
  }).addTo(map);
}
function initCats(){
  const box=document.getElementById('cats');
  const saved=LS.get('cats',null);
  Object.keys(CATS).forEach(code=>{
    const on = saved? saved.includes(code) : true;
    if(on) enabled.add(code);
    const el=document.createElement('div');
    el.className='cat'+(on?' on':''); el.dataset.code=code;
    el.innerHTML=`<span class="dot" style="background:${CATS[code].color}"></span>${CATS[code].name}`;
    el.onclick=()=>{ el.classList.toggle('on');
      el.classList.contains('on')?enabled.add(code):enabled.delete(code);
      LS.set('cats',[...enabled]); render(); };
    box.appendChild(el);
  });
}
function bindControls(){
  const s=document.getElementById('slider');
  s.oninput=()=>render();
  const w=document.getElementById('window');
  w.oninput=()=>{ document.getElementById('winVal').textContent=w.value; LS.set('window',+w.value); render(); };
  // 左右キーで年を移動（Shiftで10ノッチ）。スライダー操作中はネイティブに任せる
  document.addEventListener('keydown',e=>{
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
    if(document.activeElement===s) return;
    const d=(e.key==='ArrowRight'?1:-1)*(e.shiftKey?10:1);
    s.value=Math.max(+s.min, Math.min(+s.max, +s.value+d));
    render(); e.preventDefault();
  });
  const pb=document.getElementById('play');
  let timer=null;
  pb.onclick=()=>{
    if(timer){ clearInterval(timer); timer=null; pb.textContent='▶ 再生'; pb.classList.remove('on'); return; }
    pb.textContent='⏸ 停止'; pb.classList.add('on');
    timer=setInterval(()=>{
      let i=+s.value;
      const inc = STOPS[i] < 476 ? 1 : 6;  // 先史・古代は1停止ずつ、中世以降は6年ずつ
      i+=inc; if(i>=+s.max){ i=+s.max; clearInterval(timer); timer=null; pb.textContent='▶ 再生'; pb.classList.remove('on'); }
      s.value=i; render();
    },120);
  };
}

function isActive(ev, year, win){
  if(!enabled.has(ev.cat)) return false;
  const h=snapStep(ev.year)/2;         // その出来事の年代の刻みに応じた最小許容（スナップで必ず拾える）
  if(ev.year_end===null) return ev.year-h<=year;                          // 継続中（開始年以降ずっと）
  if(ev.year_end>ev.year) return ev.year-h<=year && year<=ev.year_end+h;  // スパン
  return Math.abs(ev.year-year)<=Math.max(win,h);                          // 点イベント
}

function render(){
  const sliderVal=+document.getElementById('slider').value;
  const year=STOPS[sliderVal] ?? -550;
  LS.set('year', sliderVal);
  const win=+document.getElementById('window').value;
  const era=eraOf(year);

  document.getElementById('yearBig').textContent=fmtYear(year);
  const badge=document.getElementById('eraBadge');
  badge.textContent=era.name; badge.style.background=era.color;

  const active=EVENTS.filter(e=>isActive(e,year,win));
  document.getElementById('count').textContent=`${active.length}件`;

  // ---- markers: 種別×座標でグルーピング。座標空欄はarea重心にフォールバック ----
  markers.forEach(m=>map.removeLayer(m)); markers=[]; markerByKey={};
  const groups={};
  active.forEach(e=>{
    let la=e.lat, lo=e.lon;
    if(la===null){ const r=REGIONS[e.area]; if(!r||r.lat===null) return; la=r.lat; lo=r.lon; }
    const k=e._type+'@'+la.toFixed(2)+','+lo.toFixed(2);
    (groups[k]=groups[k]||{la,lo,type:e._type,evs:[]}).evs.push(e);
  });
  Object.values(groups).forEach(g=>{
    g.evs.sort((a,b)=>b.imp-a.imp);
    const top=g.evs[0];
    const st=markerStyle(g.type, top, g.evs.length);
    const m=L.circleMarker([g.la,g.lo], st).addTo(map);
    m._base={radius:st.radius, color:st.color, weight:st.weight};
    const tip = g.evs.slice(0,10).map(e=>`${e.label}　${e.title}`).join('<br>')+
      (g.evs.length>10?`<br>…ほか${g.evs.length-10}件`:'');
    m.bindTooltip(tip,{direction:'top',opacity:0.95,sticky:true});  // ホバーでバルーン
    m.on('click',()=>highlight(g.evs));                              // クリックでパネル該当をハイライト
    g.evs.forEach(e=>markerByKey[e._type+'#'+e.id]=m);              // パネル→地図の対応
    markers.push(m);
  });

  showPanel(active);
}
// 種別ごとのマーカー見た目（国=大きく中空っぽ・人=小さめ・出来事=標準）
function markerStyle(type, top, count){
  const s={ color:'#fff', weight:1, fillColor:(CATS[top.cat]?CATS[top.cat].color:'#888'),
            fillOpacity:.85, radius:6+Math.min(count,5)+top.imp };
  if(type==='polity'){ s.fillOpacity=.4; s.weight=2; s.dashArray='2'; s.radius+=3; }
  else if(type==='person'){ s.radius=Math.max(5,4+top.imp*0.8); s.fillOpacity=.9; }
  return s;
}

function evCard(e){
  const col=CATS[e.cat]?CATS[e.cat].color:'#888';
  const reg=REGIONS[e.area]?REGIONS[e.area].name:e.region;
  return `<div class="ev" data-key="${e._type}#${e.id}" style="border-left-color:${col}">
    <div class="y">${e.label} · ${reg}</div>
    <div class="t"><a href="${wikiUrl(e)}" target="_blank" rel="noopener">${e.title}<span class="ext">↗</span></a></div>
    ${e.summary?`<div class="s">${e.summary}</div>`:''}
    <div class="meta">${CATS[e.cat]?CATS[e.cat].name:e.cat} · <span class="stars">${stars(e.imp)}</span></div>
  </div>`;
}
function showPanel(list){
  list = list.slice().sort((a,b)=>a.year-b.year || b.imp-a.imp);
  document.getElementById('panelTitle').textContent = `この時代 (${list.length})`;
  let html='';
  LAYERS.forEach(L=>{
    const items=list.filter(e=>e._type===L.key);
    if(!items.length) return;
    html += `<div class="sec">この時代の${L.label} (${items.length})</div>` + items.map(evCard).join('');
  });
  document.getElementById('panel').innerHTML = html || '<div class="small">該当なし。スライダーや表示幅・レイヤーを動かしてみてください。</div>';
  // パネルのカードをホバー → 地図の対応マーカーを強調＋バルーン
  document.querySelectorAll('#panel .ev').forEach(el=>{
    el.onmouseenter=()=>emphasize(el.dataset.key,true);
    el.onmouseleave=()=>emphasize(el.dataset.key,false);
  });
}
// パネル⇄地図: マーカーを一時的に強調しバルーン表示
function emphasize(key, on){
  const m=markerByKey[key]; if(!m) return;
  if(on){ m.setStyle({color:'#ffd34d', weight:4}); m.setRadius((m._base.radius||8)+4); m.bringToFront(); m.openTooltip(); }
  else { m.setStyle({color:m._base.color, weight:m._base.weight}); m.setRadius(m._base.radius); m.closeTooltip(); }
}
// マーカークリック: 該当カードを全体の中でハイライト（絞り込まず比較を維持）
function highlight(evs){
  const keys=new Set(evs.map(e=>e._type+'#'+e.id));
  let first=null;
  document.querySelectorAll('#panel .ev').forEach(el=>{
    if(keys.has(el.dataset.key)){ el.classList.add('hl'); if(!first) first=el; }
    else el.classList.remove('hl');
  });
  if(first) first.scrollIntoView({block:'nearest',behavior:'smooth'});
}

boot();
</script>
</body>
</html>
